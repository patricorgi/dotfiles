#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  { on = ["I", "G"], run = 'shell --orphan -- /usr/bin/open -n -a "$HOME/.hammerspoon/ImageGrid.app" --args "$(pwd -P)"', desc = "Browse current folder in Image Grid" },
  { on = [ "s", "s" ], run = "shell --orphan -- /usr/bin/osascript -e 'on run argv' -e 'tell application id \"com.runningwithcrayons.Alfred\" to action argv as type \"file\"' -e 'end run' \"$@\"", desc = "Alfred Universal Actions for selected files" },
  # Use Yazi's clipboard support without depending on tmux.
  { on = [ "c", "c" ], run = "copy path", desc = "Copy file path to clipboard" },
  { on = [ "c", "p" ], run = "copy path", desc = "Copy file path to clipboard" },
  { on = "<C-c>", run = "close", desc = "Close current tab" },
  { on = "q", run = 'shell -- if [ -n "$YAZI_PRIVATE_SESSION" ]; then tmux -L yazi-private detach-client -s "$YAZI_PRIVATE_SESSION"; fi', desc = "Hide persistent Yazi" },
  { on = "Q", run = "plugin autosession-cursor -- save-and-quit", desc = "Quit immediately" },
  { on = "T", run = "plugin toggle-pane max-preview", desc = "Maximize or restore preview pane" },
  { on = [ "M", "s" ], run = "plugin sshfs -- menu", desc = "Open SSHFS options" },
  { on = [ "M", "M" ], run = "plugin sshfs -- mount --jump", desc = "Mount SSHFS host and jump" },
  { on = [ "M", "Z" ], run = "plugin sshfs -- frecency", desc = "SSHFS directory frecency" },
  { on = [ "M", "U" ], run = "plugin sshfs -- unmount", desc = "Unmount SSHFS" },
   { on = [ "g", "z" ], run = "plugin root-zoom", desc = "Display ROOT macro with zoom" },
]
