# vim:filetype=kitty
# vim:fdm=marker

# unmap
map alt+shift+h no_op
map alt+shift+l no_op
map cmd+shift+d no_op
map ctrl+shift+r no_op
map cmd+r no_op
map cmd+` no_op
map cmd+shift+` no_op

# kitty
# Window cycling is handled only by ~/.hammerspoon/kitty-window-cycle.lua.
map ctrl+space>b scroll_to_prompt -1
map ctrl+space>f scroll_to_prompt 1
# Managed, host-aware kzw Condor queue tab (Ctrl+Space, then uppercase Q).
map --when-focus-on var:kzw_pane ctrl+space>shift+q kitten ~/workspaces/kitty-zmx-workspaces/kzw/utility_kitten.py
map --when-focus-on var:kzw_pane ctrl+space>ctrl+space send_key ctrl+space
# Keep managed prefix actions in the same focus group as the queue/passthrough.
map --when-focus-on var:kzw_pane ctrl+space>b scroll_to_prompt -1
map --when-focus-on var:kzw_pane ctrl+space>f scroll_to_prompt 1
map --when-focus-on var:kzw_pane cmd+shift+r kitten ~/workspaces/kitty-zmx-workspaces/kzw/retry_kitten.py
# Keep Ctrl+M equivalent to Enter with extended keyboard protocols (e.g. Flyline).
map ctrl+m send_key enter
map ctrl+h send_key backspace
map cmd+v paste_from_clipboard
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 change_font_size all 0
map cmd+alt+1 goto_tab 1
map cmd+alt+2 goto_tab 2
map cmd+alt+3 goto_tab 3
map cmd+alt+4 goto_tab 4
map cmd+alt+5 goto_tab 5
map cmd+alt+6 goto_tab 6
map cmd+alt+7 goto_tab 7
map cmd+alt+8 goto_tab 8
map cmd+alt+9 goto_tab 9
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
# Use kzw's installed launch wrapper for native tabs in managed workspaces.
map ctrl+shift+t new_tab_with_cwd
map cmd+t new_tab_with_cwd
map --when-focus-on var:kzw_pane ctrl+shift+t new_tab
map --when-focus-on var:kzw_pane cmd+t new_tab
map cmd+shift+ctrl+y kitten helpers/sshfs_yazi.py
map --when-focus-on var:kzw_local ctrl+shift+w kitten ~/workspaces/kitty-zmx-workspaces/kzw/local_tab_kitten.py close
map --when-focus-on var:kzw_local ctrl+shift+q kitten ~/workspaces/kitty-zmx-workspaces/kzw/local_tab_kitten.py close
map cmd+w close_window_with_confirmation
map cmd+shift+w close_os_window
map --when-focus-on "var:kzw_pane or var:kzw_local or var:kzw_utility" cmd+w kitten ~/workspaces/kitty-zmx-workspaces/kzw/close_kitten.py pane
map --when-focus-on "var:kzw_pane or var:kzw_local" cmd+shift+w kitten ~/workspaces/kitty-zmx-workspaces/kzw/detach_kitten.py
map ctrl+shift+w close_window
map cmd+enter combine : goto_layout splits : launch --cwd=current --location=split
map ctrl+shift+enter launch --cwd=current --location=hsplit
map ctrl+shift+alt+enter launch --cwd=current --location=vsplit
map --when-focus-on var:kzw_pane cmd+enter combine : goto_layout splits : kitten ~/workspaces/kitty-zmx-workspaces/kzw/create_kitten.py split
map --when-focus-on var:kzw_pane ctrl+shift+enter kitten ~/workspaces/kitty-zmx-workspaces/kzw/create_kitten.py right
map --when-focus-on var:kzw_pane ctrl+shift+alt+enter kitten ~/workspaces/kitty-zmx-workspaces/kzw/create_kitten.py below
# Do not start unmanaged shells from a workspace's companion or utility tab.
map --when-focus-on "var:kzw_local or var:kzw_utility" ctrl+shift+t no_op
map --when-focus-on "var:kzw_local or var:kzw_utility" cmd+t no_op
map --when-focus-on "var:kzw_local or var:kzw_utility" cmd+enter no_op
map --when-focus-on "var:kzw_local or var:kzw_utility" ctrl+shift+enter no_op
map --when-focus-on "var:kzw_local or var:kzw_utility" ctrl+shift+alt+enter no_op
map ctrl+shift+n new_os_window
map ctrl+shift+o next_layout
map ctrl+shift+f show_scrollback
map cmd+f search_scrollback
map cmd+shift+f launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting nvim --clean --cmd 'set eventignore=FileType' -c 'set clipboard=unnamedplus' -c 'call nvim_open_term(0, {})' -c 'set nomodified nolist' -c 'normal! G' -
map cmd+shift+ctrl+f kitten ~/.config/kitty/helpers/last_command.py
map cmd+shift+ctrl+c kitten ~/.config/kitty/helpers/last_command.py --copy
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right
map ctrl+shift+z toggle_layout stack

# One ASCII shortcut key after Ctrl+X, only in OpenCode (including over SSH).
include opencode-leader.conf

