# Declaring a mode creates its entry binding; the next line replaces that entry
# with an OpenCode-aware kitten that also forwards Ctrl+X to the application.
map --new-mode opencode_ascii_leader --on-action end --on-unknown passthrough_and_end --timeout 1.5 ctrl+x
map ctrl+x kitten ~/.config/kitty/helpers/opencode_leader.py

# Modal mappings bypass the macOS IME without changing the selected input source.
